<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Times Square</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'Arial Black', Arial, sans-serif;
    cursor: crosshair;
    user-select: none;
  }
  #bg {
    position: fixed; inset: 0;
    background: #000;
    z-index: 0;
  }
  .billboard {
    position: absolute;
    font-weight: 900;
    text-transform: uppercase;
    animation: flicker linear infinite;
    pointer-events: none;
  }
  @keyframes flicker {
    0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.1}
    94%{opacity:1} 96%{opacity:0.3} 97%{opacity:1}
  }
  @keyframes shake {
    0%{transform:translate(-2px,-1px) rotate(-0.5deg)}
    25%{transform:translate(2px,1px) rotate(0.5deg)}
    50%{transform:translate(-1px,2px) rotate(-0.3deg)}
    75%{transform:translate(1px,-1px) rotate(0.3deg)}
    100%{transform:translate(-2px,-1px) rotate(-0.5deg)}
  }
  @keyframes pulse {
    0%,100%{transform:scale(1)} 50%{transform:scale(1.08)}
  }
  @keyframes blink {
    0%,100%{opacity:1} 50%{opacity:0}
  }
  #zoom-layer {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    pointer-events: none;
    transform-origin: center center;
  }
  #center-text { text-align: center; }
  #color-flash {
    position: fixed; inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }
  #warning-overlay {
    position: fixed; inset: 0;
    background: #000;
    z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 24px;
    padding: 20px;
  }
  #warning-overlay h1 {
    color: #ffff00;
    font-size: clamp(32px, 8vw, 64px);
    font-weight: 900;
    text-align: center;
    text-shadow: 0 0 30px #ffff00, 0 0 60px #ff8800;
    animation: shake 0.15s infinite;
  }
  #warning-overlay p {
    color: #ffffff;
    font-size: clamp(16px, 3vw, 22px);
    text-align: center;
    max-width: 500px;
    line-height: 1.5;
    text-shadow: 0 0 10px #fff;
  }
  #enter-btn {
    margin-top: 10px;
    padding: 18px 60px;
    background: #ffff00;
    color: #000;
    border: none;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 4px;
    cursor: pointer;
    animation: pulse 0.6s ease-in-out infinite;
    border-radius: 4px;
  }
  #enter-btn:hover { background: #ff8800; }
  #tap-hint {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: clamp(16px, 4vw, 24px);
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: blink 0.7s step-end infinite;
    z-index: 100;
    text-shadow: 0 0 20px #ffff00;
    white-space: nowrap;
  }
  #main-title {
    font-size: clamp(50px, 12vw, 100px);
    font-weight: 900;
    color: #ffff00;
    text-shadow: 0 0 40px #ffff00, 0 0 80px #ff8800;
    animation: shake 0.15s infinite;
    line-height: 1;
  }
  #sub-title {
    font-size: clamp(28px, 6vw, 50px);
    font-weight: 900;
    color: #ff00ff;
    text-shadow: 0 0 20px #ff00ff;
    margin-top: 10px;
    animation: shake 0.1s infinite;
  }
</style>
</head>
<body>

<!-- Step 1: Entry screen -->
<div id="warning-overlay">
  <h1>⚠ TIMES SQUARE ⚠</h1>
  <p>Andar jaane ke baad wapas aana<br>mushkil ho sakta hai 😈<br><br>Apne risk pe enter karo!</p>
  <button id="enter-btn" onclick="enterSite()">ANDAR JAO 😈</button>
</div>

<!-- Color flash overlay -->
<div id="color-flash"></div>

<!-- Billboard background -->
<div id="bg"></div>

<!-- Zoom layer with center text -->
<div id="zoom-layer">
  <div id="center-text">
    <div id="main-title">WELCOME</div>
    <div id="sub-title">TO HELL 😈</div>
  </div>
</div>

<!-- Tap hint (shown after entry, before tap) -->
<div id="tap-hint" style="display:none;">TAP ANYWHERE TO START 🔥</div>

<script>
  const colors = ['#ff0000','#ff6600','#ffff00','#00ff00','#00ffff','#ff00ff','#ffffff','#ff0080','#80ff00','#0080ff'];
  const words = ['HOT','SALE','WOW','LIVE','FREE','NOW','BOOM','FLASH','BIG','DEAL','NEW','YES','FIRE','OMG','WILD','LOUD'];

  function rnd(a,b){ return Math.floor(Math.random()*(b-a))+a; }
  function rndColor(){ return colors[rnd(0,colors.length)]; }

  const bg = document.getElementById('bg');
  const flash = document.getElementById('color-flash');
  const zoomLayer = document.getElementById('zoom-layer');
  const tapHint = document.getElementById('tap-hint');

  let billboardInterval = null;
  let zoomScale = 1;
  let zoomActive = false;
  let started = false;
  let audio = null;

  // Make random billboard text
  function makeBillboard() {
    const el = document.createElement('div');
    el.className = 'billboard';
    el.textContent = words[rnd(0,words.length)];
    const sz = rnd(18, 90);
    const c1 = rndColor();
    const c2 = rndColor();
    el.style.cssText = `
      left:${rnd(0,88)}%;
      top:${rnd(0,88)}%;
      font-size:${sz}px;
      color:${c1};
      text-shadow:0 0 12px ${c2}, 0 0 24px ${c1};
      animation-duration:${(Math.random()*3+0.5).toFixed(1)}s;
      transform:rotate(${rnd(-20,20)}deg);
    `;
    bg.appendChild(el);
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, rnd(800,3500));
  }

  // Color flash effect
  function startFlash() {
    setInterval(()=>{
      flash.style.background = rndColor();
      flash.style.opacity = (Math.random()*0.25).toFixed(2);
    }, 70);
  }

  // Zoom animation loop
  function doZoom() {
    if (!zoomActive) return;
    zoomScale += 0.006;
    if (zoomScale > 60) zoomScale = 1;
    zoomLayer.style.transform = `scale(${zoomScale})`;
    requestAnimationFrame(doZoom);
  }

  // Called when user clicks Enter button
  function enterSite() {
    document.getElementById('warning-overlay').style.display = 'none';
    tapHint.style.display = 'block';
    // Start billboards
    billboardInterval = setInterval(makeBillboard, 120);
    startFlash();
  }

  // Called on first tap/click after entry
  function startEverything() {
    if (started) return;
    started = true;
    tapHint.style.display = 'none';

    // Zoom
    zoomActive = true;
    doZoom();

    // Shake body
    document.body.style.animation = 'shake 0.08s infinite';

    // Play music (upload music.mp3 to same folder as this file on GitHub)
    audio = new Audio('music.mp3');
    audio.loop = true;
    audio.volume = 1.0;
    audio.play().catch(e => console.log('Audio error:', e));
  }

  document.addEventListener('click', startEverything);
  document.addEventListener('touchstart', startEverything, { passive: true });

  // Close tab warning
  window.addEventListener('beforeunload', (e) => {
    e.preventDefault();
    e.returnValue = 'Sach mein jaana chahte ho bhai? 😂';
    return 'Sach mein jaana chahte ho bhai? 😂';
  });

  // Disable right click
  document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
